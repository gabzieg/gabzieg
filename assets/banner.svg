<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 200" width="100%" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#30363d" stroke-width="0.6" stroke-opacity="0.35" />
    </pattern>
  </defs>

  <!-- Card Background -->
  <rect width="840" height="200" rx="14" fill="url(#bg)" stroke="#30363d" stroke-width="1.5" />
  <rect width="840" height="200" rx="14" fill="url(#grid)" />

  <!-- Top Accent Line -->
  <rect x="60" y="0" width="180" height="3" rx="1.5" fill="url(#accent)" />

  <!-- Terminal Prompt Badge -->
  <g transform="translate(60, 42)">
    <rect x="0" y="0" width="128" height="26" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1" />
    <circle cx="14" cy="13" r="4" fill="#38bdf8" />
    <text x="26" y="17" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="600" fill="#c9d1d9" letter-spacing="0.5">~/gabzieg</text>
  </g>

  <!-- Main Name -->
  <text x="60" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="38" font-weight="800" fill="#f0f6fc" letter-spacing="-0.5">
    Gabriel Ziegemann
  </text>

  <!-- Subtitle / Focus -->
  <text x="60" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#8b949e">
    Software Engineering • Native Apps, AI Systems &amp; High-Utility Automation
  </text>

  <!-- Motto on Bottom Right -->
  <text x="780" y="174" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-style="italic" fill="#6e7681">
    "Auribus teneo lupum."
  </text>

  <!-- Decorative Geometric Mark on Right -->
  <g transform="translate(690, 44)" opacity="0.85">
    <rect x="0" y="0" width="88" height="88" rx="18" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
    <path d="M 26 32 L 40 44 L 26 56" fill="none" stroke="url(#accent)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="46" y1="56" x2="62" y2="56" stroke="#c9d1d9" stroke-width="3.5" stroke-linecap="round" />
  </g>
</svg>
