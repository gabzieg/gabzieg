<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 190" width="100%" height="190">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="peakGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#161b22" stop-opacity="0.0" />
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#30363d" stroke-width="0.6" stroke-opacity="0.35" />
    </pattern>
  </defs>

  <!-- Card Background -->
  <rect width="840" height="190" rx="14" fill="url(#bg)" stroke="#30363d" stroke-width="1.5" />
  <rect width="840" height="190" rx="14" fill="url(#grid)" />

  <!-- Top Accent Line -->
  <rect x="60" y="0" width="180" height="3" rx="1.5" fill="url(#accent)" />

  <!-- Minimalist Handle Pill -->
  <g transform="translate(60, 40)">
    <rect x="0" y="0" width="118" height="26" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1" />
    <circle cx="14" cy="13" r="4" fill="#38bdf8" />
    <text x="26" y="17" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="600" fill="#c9d1d9" letter-spacing="0.5">@gabzieg</text>
  </g>

  <!-- Main Name -->
  <text x="60" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="38" font-weight="800" fill="#f0f6fc" letter-spacing="-0.5">
    Gabriel Ziegemann
  </text>

  <!-- Subtitle / Focus -->
  <text x="60" y="144" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#8b949e">
    Software Engineering • Native Apps, AI Systems &amp; High-Utility Automation
  </text>

  <!-- Minimalist Geometric Mountain in Top-Right -->
  <g transform="translate(660, 32)">
    <!-- Subtle Moon / Sun Halo -->
    <circle cx="96" cy="22" r="10" fill="none" stroke="#818cf8" stroke-width="1.8" stroke-opacity="0.7" />
    <circle cx="96" cy="22" r="3" fill="#38bdf8" fill-opacity="0.8" />

    <!-- Back Peak (Right) -->
    <polygon points="56,104 92,44 128,104" fill="url(#peakGrad)" />
    <polyline points="68,84 92,44 128,104" fill="none" stroke="#8b949e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.65" />
    <line x1="92" y1="44" x2="84" y2="76" stroke="#8b949e" stroke-width="1.5" stroke-linecap="round" opacity="0.45" />

    <!-- Main Peak (Left/Center) -->
    <polygon points="10,104 54,28 98,104" fill="url(#peakGrad)" />
    <polyline points="10,104 54,28 98,104" fill="none" stroke="url(#accent)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Minimalist Snow Cap / Facet Ridge -->
    <polyline points="41,50 54,60 66,49" fill="none" stroke="#c9d1d9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />
    <line x1="54" y1="28" x2="54" y2="60" stroke="#c9d1d9" stroke-width="1.6" stroke-linecap="round" opacity="0.6" />

    <!-- Horizon Base Line -->
    <line x1="2" y1="104" x2="134" y2="104" stroke="#30363d" stroke-width="2" stroke-linecap="round" />
    <line x1="24" y1="112" x2="112" y2="112" stroke="#30363d" stroke-width="1.2" stroke-linecap="round" opacity="0.6" />
  </g>
</svg>
